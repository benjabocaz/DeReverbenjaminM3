name: Build DeReverbenjamin M3 AU

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Audio Unit (.component)
        run: cmake --build build --config Release --target DeReverbenjaminM3_AU -j 4

      - name: Upload .component Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeReverbenjamin-M3-AU-macOS
          path: build/DeReverbenjaminM3_artefacts/Release/AU/
